; Local build for the physical ESP32 testbed, and for simulating with the
; Wokwi VS Code extension when wokwi.com's build queue is backed up.
;
;   python tools/make_pio_src.py         regenerate src/ from sketch.ino
;   python tools/make_pio_src.py --lite  regenerate src/ from the lite sketch
;   pio run                              build -> .pio/build/esp32dev/
;
; src/ is generated - never edit it. wokwi.toml points at the artefacts below.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    knolleary/PubSubClient
    bblanchon/ArduinoJson
