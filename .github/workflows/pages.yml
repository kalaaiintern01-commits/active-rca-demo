# Publish the live dashboard (active-rca-demo/site) to GitHub Pages on every push to main.
name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
    paths: ["active-rca-demo/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: active-rca-demo/site
          lfs: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: active-rca-demo/site
      - id: deployment
        uses: actions/deploy-pages@v4
