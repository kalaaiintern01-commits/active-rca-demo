; Pin finder - wiring diagnostic for the Active-RCA node. Flash it, read the serial monitor,
; then flash the normal firmware (../../) again.
;   pio run -t upload        (from this folder)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
