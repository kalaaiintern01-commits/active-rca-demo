; Local build of the replay node - for compile checks, the Wokwi VS Code extension
; (wokwi.toml points at the artefacts) or a physical ESP32 DevKit.
;
;   pio run                               build -> .pio/build/esp32dev/firmware.bin
;   python tools/make_wokwi_single.py     regenerate wokwi/sketch.ino for wokwi.com
;
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit BusIO
